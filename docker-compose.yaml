services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: financial-analysis-postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: financial-analysis-backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      # Inside Docker, use the Compose service name
      # and PostgreSQL's internal container port.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      MONITORING_JUDGE_MODEL: gemini-2.5-flash-lite
      MONITORING_JUDGE_SAMPLE_RATE: 0.25

    ports:
      - "8000:8000"

    volumes:
      - generated_reports:/app/outputs/generated_reports

    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: financial-analysis-frontend
    restart: unless-stopped

    environment:
      # Keep this name if your api_client.py reads FASTAPI_BASE_URL.
      FASTAPI_BASE_URL: http://backend:8000

    ports:
      - "${STREAMLIT_PORT:-8501}:8501"

    depends_on:
      - backend


  grafana:
    image: grafana/grafana:latest
    container_name: financial-analysis-grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

      GF_USERS_ALLOW_SIGN_UP: "false"

      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      postgres:
        condition: service_healthy


volumes:

  # Reuse the PostgreSQL database populated by
  # your ingestion workflow.
  postgres_data:
    external: true
    name: ingestion_postgres_data

  generated_reports:

  grafana_data: