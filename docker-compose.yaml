services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: financial-analysis-postgres

    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: financial-analysis-app

    restart: unless-stopped

    env_file:
      - .env

    environment:
      # Inside Docker, PostgreSQL is reached by the service name,
      # not localhost.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

    ports:
      - "${STREAMLIT_PORT:-8501}:8501"

    depends_on:
      postgres:
        condition: service_healthy

    command:
      [
        "uv",
        "run",
        "streamlit",
        "run",
        "deployment/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
      ]


volumes:
  postgres_data:
    external: true
    name: ingestion_postgres_data