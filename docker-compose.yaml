services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: financial-analysis-postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: financial-analysis-backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      # Inside Docker, use the service name and internal port.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: financial-analysis-frontend
    restart: unless-stopped

    environment:
      # Inside Docker, "backend" resolves to the FastAPI container.
      FASTAPI_BASE_URL: http://backend:8000

    ports:
      - "${STREAMLIT_PORT:-8501}:8501"

    depends_on:
      - backend


volumes:
  postgres_data:
    external: true
    name: ingestion_postgres_data